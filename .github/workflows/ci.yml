#
# The same check a contributor runs locally: scripts/ci.sh configures a fresh
# build directory, builds it and runs every suite. Qt comes from the installer
# action rather than the distribution, because the suites use Qt 6 APIs newer
# than the runner image's package.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build openssl libgl1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      # The conformance stage marshals every call with impacket's NDR rather
      # than this tree's, so it needs a client implementation GitHub ships.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install impacket
        run: python3 -m pip install --upgrade pip impacket

      - name: Build and test
        run: scripts/ci.sh --conformance

  # MONARCHY_WITH_LDAP=ON changes which sources are compiled, and no job passed
  # the flag, so a change that only broke that configuration looked green. It
  # needs the Qt install for the same reason the job above does: it runs the
  # same suites, not a subset.
  openldap-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build openssl libgl1 libldap2-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Build and test against OpenLDAP
        run: scripts/ci.sh --with-ldap

  # The suite that found the three defects closed in #8, #9 and #10 was a
  # throwaway sanitizer build on one developer's box. Nothing ran it again, so
  # the next one would have been found the same way: by accident. This job is
  # that build, and it halts on a UBSan diagnostic rather than printing one.
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build openssl libgl1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          cache: true

      - name: Build and test under ASan and UBSan
        run: scripts/ci.sh --sanitize --build-dir build-sanitize
